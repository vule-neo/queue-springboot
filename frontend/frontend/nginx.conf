# Produkcijska zamjena za proxy.conf.json.
# "backend" je ime servisa iz docker-compose.yml - Docker DNS ga rjesava.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: svaka ruta (/queues/1, /analytics...) vraca index.html,
    # a Angular router odatle preuzima. Bez ovoga F5 na /analytics = 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket: HTTP upgrade mora proci kroz proxy, inace STOMP ne
    # moze da se prikljuci (vidi samo obican GET koji backend odbije).
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Default 60s bi prekidao mirnu WebSocket vezu.
        proxy_read_timeout 3600s;
    }
}
