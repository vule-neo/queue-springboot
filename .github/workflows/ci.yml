# Na svaki push i PR: backend build + SVI testovi (unit + integracioni na
# Testcontainers-u), frontend build. Docker je vec dostupan na ubuntu
# runnerima, pa Testcontainers radi bez podesavanja.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queue-backend/queue-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          # Kesira ~/.m2 po hash-u pom.xml - drugi build ne skida zavisnosti ponovo.
          cache: maven

      - name: Build i testovi
        # mvnw sa Windows checkouta moze biti bez execute bita - zato chmod.
        # -B: batch mode, bez progress bara u logu.
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Izvjestaj o testovima (i kad padnu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: queue-backend/queue-backend/target/surefire-reports/

  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - run: npm ci
      - run: npx ng build --configuration production

  docker:
    name: Docker image build (bez pusha)
    runs-on: ubuntu-latest
    # Tek kad su testovi zeleni - nema smisla graditi image od koda koji pada.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build oba image-a
        run: |
          docker build -t qms-backend ./queue-backend/queue-backend
          docker build -t qms-frontend ./frontend/frontend
