spring.application.name=queue-backend

# Tajne (lozinka baze, JWT kljuc) stoje u application-local.properties,
# koji je u .gitignore. Vrijednosti odatle imaju prednost nad ovima ovdje.
# "optional:" znaci da app nece pasti ako fajla nema - pasce kasnije,
# sa jasnijom porukom o tome koja vrijednost nedostaje.
spring.config.import=optional:classpath:application-local.properties

# --- Baza ---
spring.datasource.url=jdbc:postgresql://localhost:5432/queue_db
spring.datasource.username=postgres

# --- JPA / Hibernate ---
# validate: Hibernate smije samo provjeriti da se entiteti slazu sa semom,
# nikad je mijenjati. Semu drzi iskljucivo Flyway.
spring.jpa.hibernate.ddl-auto=validate
# false: lazy loading van transakcije puca odmah umjesto da tiho radi N+1
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.expiration-minutes=120

# --- Redis ---
# Lokalno: docker run -d -p 6379:6379 --name redis redis:7-alpine
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Lettuce podrazumijevano ceka 60s na odgovor. Kes koji 60s "razmislja"
# je gori od nikakvog kesa - ako Redis ne odgovori za 1s, citamo iz baze.
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
spring.cache.type=redis
# Sigurnosna mreza: i da eviction negdje zakaze, unos umire sam za 30s.
app.cache.queue-tickets-ttl-seconds=30

# --- Rate limiting ---
# Koliko brojeva jedan korisnik smije uzeti u minuti (POST /api/queues/{id}/tickets).
app.ratelimit.tickets.per-minute=5
